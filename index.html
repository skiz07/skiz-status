<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>skiz Store — status</title>
    <meta name="description" content="Is skiz Store up? Live status, checked every 5 minutes from outside.">
    <!-- this page lives on GitHub, not on the shop's server: it stays up when the shop is down -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html { -webkit-tap-highlight-color: transparent; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #FAFBFD;
            --surface: #FFFFFF;
            --text: #1D1D1F;
            --muted: #6E6E73;
            --faint: #AEAEB2;
            --accent: #296FCF;
            --border: rgba(0, 0, 0, .08);
            --up: #16A34A;
            --down: #DC2626;
            --slow: #6E6E73;
            --asleep: #64748B;
            --bar-empty: #E5E5EA;
            --state: var(--faint);
            --state-rgb: 174, 174, 178;
        }
        body[data-state="up"]   { --state: var(--up);   --state-rgb: 22, 163, 74; }
        body[data-state="down"] { --state: var(--down); --state-rgb: 220, 38, 38; }
        body[data-state="slow"] { --state: var(--slow); --state-rgb: 110, 110, 115; }
        /* switched off on purpose (the server said so before it went): calm, not an outage */
        body[data-state="asleep"], body[data-state="restarting"] { --state: var(--asleep); --state-rgb: 100, 116, 139; }
        /* not answering and GitHub wouldn't say whether it is planned: neither red nor calm */
        body[data-state="unsure"] { --state: var(--slow); --state-rgb: 110, 110, 115; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        html, body { overflow-x: clip; }

        /* the same light and grid as the shop's 404, tinted by the current state */
        .glow {
            position: fixed; top: 42%; left: 50%;
            width: 700px; height: 700px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(var(--state-rgb), .10) 0%, rgba(var(--state-rgb), .035) 35%, transparent 70%);
            pointer-events: none;
            transition: background .4s ease;
        }
        .grid {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(0, 0, 0, .035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, .035) 1px, transparent 1px);
            background-size: 80px 80px;
            -webkit-mask-image: radial-gradient(ellipse at center, #000 0%, transparent 70%);
                    mask-image: radial-gradient(ellipse at center, #000 0%, transparent 70%);
            pointer-events: none;
        }

        .page {
            position: relative; z-index: 1;
            width: min(760px, calc(100% - 32px));
            margin: auto 0;
            padding: 48px 0 32px;
            text-align: center;
        }

        .pill {
            display: inline-flex; align-items: center; gap: 9px;
            padding: 8px 13px;
            margin-bottom: 28px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255, 255, 255, .8);
            color: var(--muted);
            font-size: 12px; font-weight: 600;
            letter-spacing: .04em; text-transform: uppercase;
        }
        .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--state);
            box-shadow: 0 0 0 4px rgba(var(--state-rgb), .14), 0 0 12px rgba(var(--state-rgb), .5);
        }
        body[data-state="up"] .dot { animation: beat 2.4s ease-in-out infinite; }
        @keyframes beat { 50% { box-shadow: 0 0 0 7px rgba(var(--state-rgb), .06), 0 0 14px rgba(var(--state-rgb), .35); } }

        /* the big number: uptime over 90 days, with the outlined echo of the 404 */
        .big {
            position: relative;
            display: inline-block;
            font-size: clamp(84px, 17vw, 190px);
            line-height: .85;
            font-weight: 800;
            letter-spacing: -.07em;
            color: var(--text);
            user-select: none;
            font-variant-numeric: tabular-nums;
        }
        .big::after {
            content: attr(data-echo);
            position: absolute; inset: 0;
            z-index: -1;
            color: transparent;
            -webkit-text-stroke: 1px rgba(var(--state-rgb), .45);
            transform: translate(6px, 6px);
        }
        .big-label {
            margin-top: 14px;
            color: var(--faint);
            font-size: 12px; font-weight: 700;
            letter-spacing: .12em; text-transform: uppercase;
        }

        h1 {
            margin-top: 38px;
            font-size: clamp(26px, 4vw, 40px);
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: -.035em;
        }
        .description {
            max-width: 520px;
            margin: 14px auto 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }

        /* 90 days, one bar each: green = no downtime, red = some, grey = no data yet */
        .card {
            margin: 38px auto 0;
            padding: 20px 22px 16px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
            text-align: left;
        }
        .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
        .card-name { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; }
        .card-name .dot { width: 8px; height: 8px; }
        .card-state { font-size: 13px; font-weight: 600; color: var(--state); }
        .bars { display: grid; grid-template-columns: repeat(90, 1fr); gap: 2px; height: 34px; }
        .bar { border-radius: 2px; background: var(--bar-empty); position: relative; }
        .bar.ok   { background: var(--up); }
        .bar.part { background: #F87171; }
        .bar.bad  { background: var(--down); }
        .bar:hover { opacity: .75; }
        .bar[data-tip]:hover::after {
            content: attr(data-tip);
            position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
            padding: 6px 9px; border-radius: 8px;
            background: var(--text); color: #fff;
            font-size: 11.5px; font-weight: 600; white-space: nowrap; z-index: 2;
        }
        .bars-foot { display: flex; justify-content: space-between; margin-top: 9px; color: var(--faint); font-size: 11.5px; font-weight: 600; }

        .meta { margin-top: 18px; color: var(--faint); font-size: 12px; font-weight: 600; }

        .brand {
            position: relative; z-index: 1;
            padding: 0 0 26px;
            color: rgba(0, 0, 0, .28);
            font-size: 12px; font-weight: 700;
            letter-spacing: .12em; text-transform: uppercase;
            white-space: nowrap;
            text-decoration: none;
        }
        .brand:hover { color: rgba(0, 0, 0, .5); }

        @media (max-width: 600px) {
            .page { width: calc(100% - 32px); }
            .pill { margin-bottom: 20px; }
            .big { font-size: 22vw; }
            h1 { margin-top: 30px; }
            .description { font-size: 14px; }
            .card { padding: 16px 14px 12px; }
            .bars { grid-template-columns: repeat(45, 1fr); height: 30px; }
            .bar.old { display: none; }                       /* phones: the last 45 days */
            .brand { padding-bottom: 18px; }
        }
        @media (prefers-reduced-motion: reduce) { body[data-state="up"] .dot { animation: none; } }
    </style>
</head>
<body data-state="loading">
    <div class="grid" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>

    <main class="page">
        <div class="pill"><span class="dot"></span><span id="pill">System status · checking</span></div>

        <div class="big" id="big" data-echo="—">—</div>
        <div class="big-label">Uptime · last 90 days</div>

        <h1 id="title">Checking the store…</h1>
        <p class="description" id="desc">The store is checked from outside every five minutes.</p>

        <section class="card" aria-label="Store">
            <div class="card-head">
                <div class="card-name"><span class="dot"></span>Store</div>
                <div class="card-state" id="state">—</div>
            </div>
            <div class="bars" id="bars" role="img" aria-label="Daily availability, last 90 days"></div>
            <div class="bars-foot"><span id="from">90 days ago</span><span>Today</span></div>
        </section>

        <p class="meta" id="meta"></p>
    </main>

    <a class="brand" href="https://test.skizstudio.com/">skiz Store</a>

    <script>
    (function () {
        // data written by Upptime (GitHub Actions) into this repository; read straight from it,
        // so the page is current without being rebuilt and never touches the shop's server
        var RAW = 'https://raw.githubusercontent.com/skiz07/skiz-status/master/';
        var SLUG = 'skiz-store';
        var $ = function (id) { return document.getElementById(id); };

        function get(path) {
            return fetch(RAW + path + '?t=' + Date.now(), { cache: 'no-store' })
                .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); });
        }

        function ago(iso) {
            var s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
            if (s < 90) return 'just now';
            if (s < 5400) return Math.round(s / 60) + ' min ago';
            return Math.round(s / 3600) + ' h ago';
        }

        function drawBars(downByDay, startTime) {
            var bars = $('bars'); bars.innerHTML = '';
            var start = startTime ? new Date(startTime) : null;
            for (var i = 89; i >= 0; i--) {
                var d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - i);
                var key = d.toISOString().slice(0, 10);
                var b = document.createElement('div');
                b.className = 'bar' + (i >= 45 ? ' old' : '');
                var label = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                if (start && d < new Date(start.toDateString())) {
                    b.setAttribute('data-tip', label + ' · no data');
                } else {
                    var m = downByDay[key] || 0;
                    b.className += m === 0 ? ' ok' : (m >= 60 ? ' bad' : ' part');
                    b.setAttribute('data-tip', label + (m === 0 ? ' · no downtime' : ' · down ' + m + ' min'));
                }
                bars.appendChild(b);
            }
        }

        function show(state, now) {
            document.body.setAttribute('data-state', state);
            var text = {
                up:   ['All systems operational', 'The store is up and answering.', 'Operational'],
                slow: ['The store is slow right now', 'It answers, but slower than it should. We are on it.', 'Degraded'],
                down: ['The store is down', 'We know about it and are working on it. Your orders and data are safe.', 'Down'],
                asleep: ['The store is asleep', 'The server is switched off on purpose and will be back soon. Nothing is broken.', 'Asleep'],
                restarting: ['The store is restarting', 'A planned restart — it will be back in a minute or two.', 'Restarting'],
                unsure: ['The store isn\'t answering', 'It may be switched off on purpose — we couldn\'t confirm that right now. Try again in a few minutes.', 'Not answering'],
                unknown: ['Status unavailable', 'The latest check could not be read. Try again in a minute.', 'Unknown']
            }[state];
            $('pill').textContent = 'System status · ' + text[2];
            $('title').textContent = text[0] + (state === 'up' ? '.' : '');
            $('desc').textContent = text[1];
            $('state').textContent = text[2];
        }

        function load() {
            Promise.all([
                get('history/' + SLUG + '.yml').catch(function () { return ''; }),
                get('history/summary.json').then(JSON.parse).catch(function () { return []; })
            ]).then(function (res) {
                var yml = res[0], sum = (res[1] || []).filter(function (s) { return s.slug === SLUG; })[0] || {};
                var field = function (k) { var m = yml.match(new RegExp('^' + k + ':\\s*(.+)$', 'm')); return m ? m[1].trim() : ''; };
                var status = field('status');
                lastStatus = status;
                if (status === 'down') {
                    // not answering: switched off on purpose (a planned window) or really down?
                    if (sleepKnown === 'open') show(/restart/i.test(sleepWin.title) ? 'restarting' : 'asleep');
                    else if (sleepKnown === 'none') show('down');
                    else if (sleepAskedAt) show('unsure');        // GitHub didn't tell us: never claim "down" blindly
                    // (the very first time it stays on "Checking…" until GitHub answers)
                    if (Date.now() - sleepAskedAt > 110 * 1000) loadSleep();
                } else {
                    sleepWin = null; sleepKnown = '';             // answering: whatever the window says, it is up
                    show(status === 'up' ? 'up' : status === 'degraded' ? 'slow' : 'unknown');
                }

                var up = sum.uptime || (status === 'up' ? '100%' : '—');
                up = up.replace(/\.00%$/, '%');
                $('big').textContent = up; $('big').setAttribute('data-echo', up);

                drawBars(sum.dailyMinutesDown || {}, field('startTime'));
                lastChange = field('lastUpdated');
                showMeta();
            });
        }

        // Upptime writes the history file only when the state changes, so the time of the
        // last check comes from its latest finished run (public API, 60 calls/h per visitor)
        var lastChange = '', lastRun = '', lastStatus = '';
        function showMeta() {
            if (sleepKnown === 'open' && sleepWin) {
                $('meta').textContent = 'Since ' + new Date(sleepWin.created_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                return;
            }
            var t = lastRun > lastChange ? lastRun : lastChange;
            $('meta').textContent = t ? 'Last check ' + ago(t) : '';
        }

        // "asleep": the server opens an issue labelled sleep (+ maintenance, so Upptime opens
        // no incident) just before a planned shutdown and closes it once it is back
        // (the shop's docker/host/skiz-sleep.py). A crash or a power cut sends nothing.
        // Asked only while the store isn't answering. GitHub allows 60 such questions an
        // hour per address — on mobile data thousands of phones share one, so the answer
        // may be a refusal: then the page says it can't tell (never "down" blindly) and
        // falls back on what this browser last learnt.
        var sleepWin = null, sleepKnown = '', sleepAskedAt = 0;   // sleepKnown: 'open' | 'none' | '' (don't know)
        function remember(v) { try { localStorage.setItem('skizSleep', JSON.stringify(v)); } catch (e) {} }
        function recall() { try { return JSON.parse(localStorage.getItem('skizSleep') || 'null'); } catch (e) { return null; } }
        function loadSleep() {
            sleepAskedAt = Date.now();
            fetch('https://api.github.com/repos/skiz07/skiz-status/issues?state=open&labels=sleep&per_page=1', { cache: 'no-store' })
                .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(function (j) {
                    sleepWin = (j || []).filter(function (i) { return !i.pull_request; })[0] || null;
                    sleepKnown = sleepWin ? 'open' : 'none';
                    remember({ known: sleepKnown, win: sleepWin ? { title: sleepWin.title, created_at: sleepWin.created_at } : null, at: Date.now() });
                    if (lastStatus === 'down') load();
                })
                .catch(function () {
                    // a window this browser saw within the last 36 h (its longest) still counts
                    var m = recall();
                    if (m && m.known === 'open' && m.win && Date.now() - new Date(m.win.created_at).getTime() < 36 * 3600 * 1000) {
                        sleepWin = m.win; sleepKnown = 'open';
                    } else {
                        sleepKnown = '';
                    }
                    if (lastStatus === 'down') load();
                });
        }
        function loadRun() {
            fetch('https://api.github.com/repos/skiz07/skiz-status/actions/workflows/uptime.yml/runs?status=success&per_page=1', { cache: 'no-store' })
                .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(function (j) { var w = (j.workflow_runs || [])[0]; if (w) { lastRun = w.updated_at; showMeta(); } })
                .catch(function () {});
        }

        // public API: 60 calls an hour per address — runs 12, plus the sleep question
        // at most every 2 minutes and only while the store isn't answering (load() asks)
        load(); loadRun();
        setInterval(load, 60 * 1000);
        setInterval(loadRun, 5 * 60 * 1000);
    })();
    </script>
</body>
</html>
