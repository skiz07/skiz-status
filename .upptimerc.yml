# skiz Store status — checked from GitHub's servers every 5 minutes (Upptime, MIT).
# Only the public /health address: "ok" while the shop and its database answer.
owner: skiz07
repo: skiz-status

sites:
  - name: skiz Store
    slug: skiz-store
    url: https://test.skizstudio.com/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

# the status page is our own (index.html), not Upptime's generated site
status-website:
  name: skiz Store status
